<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> login Kixa</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="background">
    <div class="overlay"></div>

    <div class="login-box" id="formContainer">
      <!-- Formulario de Iniciar Sesión -->
      <form id="loginForm" class="form active">
        <h2>Bienvenido a <span>Kixa</span></h2>
        <p class="subtitle">Inicia sesión para continuar</p>

        <div class="input-group">
          <input type="email" id="loginEmail" required>
          <label for="loginEmail">Correo electrónico</label>
        </div>

        <div class="input-group">
          <input type="password" id="loginPassword" required>
          <label for="loginPassword">Contraseña</label>
        </div>

        <button type="submit" class="btn">Ingresar</button>

        <p class="register-text">
          ¿No tienes cuenta?
          <a href="#" id="showRegister">Regístrate</a>
        </p>
      </form>

      <!-- Formulario de Registro -->
      <form id="registerForm" class="form">
        <h2>Crea tu cuenta en <span>Kixa</span></h2>
        <p class="subtitle">Completa tus datos para unirte</p>

        <div class="input-group">
          <input type="text" id="registerName" required>
          <label for="registerName">Nombre completo</label>
        </div>

        <div class="input-group">
          <input type="email" id="registerEmail" required>
          <label for="registerEmail">Correo electrónico</label>
        </div>

        <div class="input-group">
          <input type="password" id="registerPassword" required>
          <label for="registerPassword">Contraseña</label>
        </div>

        <button type="submit" class="btn">Crear cuenta</button>

        <p class="register-text">
          ¿Ya tienes una cuenta?
          <a href="#" id="showLogin">Inicia sesión</a>
        </p>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
